name: Release build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Songmu/setup-minil@v0.0.4
      - run: minil dist --skip-prepare --no-test
      - uses: actions/attest@v4.2.2
        with:
          subject-path: '*-[v0-9]*.[0-9]*.tar.gz'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: '*-[v0-9]*.[0-9]*.tar.gz'
          if-no-files-found: error
          retention-days: 1
